[project]
name = "khatt"
version = "0.1.0"
description = "Khatt — Cairo Metro what-if: draw metro lines, see local business impacts"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.4.6",
    "numba==0.68.1",
    "pandas==3.1.1",
    "pyarrow==26.0.1",
    "geopandas==1.2.0",
    "shapely==2.2.0",
    "pyproj==3.7.2",
    "h3==4.5.0",
    "osmnx==2.1.1",
    "networkx==3.6.1",
    "scipy==1.17.1",
    "scikit-learn==1.9.1",
    "rasterio==1.4.4",
    "duckdb==2.0.0",
    "overturemaps==2.1.0",
    "r5py==1.1.7",
    "fastapi==0.162.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "osmium==4.3.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["khatt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: performance tests (deselect with '-m \"not slow\"')"]

[tool.ruff]
line-length = 100
target-version = "py311"
